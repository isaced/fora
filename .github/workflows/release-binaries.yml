name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-binaries-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: fora-darwin-arm64
          - target: bun-darwin-x64
            asset: fora-darwin-x64
          - target: bun-linux-x64
            asset: fora-linux-x64
          - target: bun-linux-arm64
            asset: fora-linux-arm64
          - target: bun-linux-x64-musl
            asset: fora-linux-x64-musl
          - target: bun-linux-arm64-musl
            asset: fora-linux-arm64-musl
          - target: bun-windows-x64
            asset: fora-windows-x64.exe
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.target }}
        run: |
          bun build ./src/cli.ts \
            --compile --minify --sourcemap \
            --target=${{ matrix.target }} \
            --outfile=${{ matrix.asset }}

      - name: Checksum
        run: sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.asset }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "${{ matrix.asset }}" \
            "${{ matrix.asset }}.sha256" \
            --clobber
