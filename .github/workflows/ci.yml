name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test (offline, fixtures only)
        run: bun test

      - name: Smoke build single-file binary
        run: bun build ./src/cli.ts --compile --outfile dist/fora && ./dist/fora engines list
